<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOTEMODE bridge</title>
</head>
<body>
<script>
(function () {
  "use strict";

  function decodeUtf8Base64(value) {
    const binary = atob(value);
    let escaped = "";
    for (let i = 0; i < binary.length; i++) {
      escaped += "%" + binary.charCodeAt(i).toString(16).padStart(2, "0");
    }
    return decodeURIComponent(escaped);
  }

  function reply(id, ok, data, error) {
    document.title = "MOD_RES:" + JSON.stringify({ id: id, ok: ok, data: data, error: error });
  }

  function handleRequest() {
    if (!location.hash || location.hash.length < 2) return;
    let request;
    try {
      request = JSON.parse(decodeURIComponent(location.hash.slice(1)));
      if (!request || !request.q || !request.f || !Array.isArray(request.a)) throw new Error("Invalid request");
      const key = decodeUtf8Base64(request.a[0]);
      if (request.f === "load") {
        reply(request.q, true, localStorage.getItem(key) || "", "");
      } else if (request.f === "save") {
        if (request.a.length < 2) throw new Error("Missing value");
        localStorage.setItem(key, decodeUtf8Base64(request.a[1]));
        reply(request.q, true, "saved", "");
      } else {
        throw new Error("Unknown command");
      }
    } catch (error) {
      reply(request && request.q ? request.q : "", false, "", String(error && error.message || error));
    }
  }

  window.addEventListener("hashchange", handleRequest);
  document.title = "MOD_BRIDGE_READY:frag1";
  handleRequest();
})();
</script>
</body>
</html>
